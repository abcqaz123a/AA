
name: Cadence Mobile Viewer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 自动定位 Android 工程目录
      - name: Locate Gradle project
        shell: bash
        run: |
          echo "========== Repository files =========="
          ls -la

          echo "========== Searching Gradle project =========="

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::找不到 settings.gradle 或 settings.gradle.kts"
            echo "请确认 Android 工程源码已经上传到 GitHub 仓库。"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Found Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========== Project root files =========="
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Mobile-Viewer-V0.2.0
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Mobile-Viewer-Build-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
