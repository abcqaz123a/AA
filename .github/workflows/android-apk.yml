
name: Cadence Mobile Viewer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 解压 Android 工程源码
      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="Cadence-Mobile-Viewer-V0.2.0-parser-validation.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::找不到源码 ZIP 文件"
            ls -la
            exit 1
          fi

          echo "开始解压 Android 工程..."
          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE"

          echo "解压完成，检查工程文件..."
          ls -la

          if [ ! -f "settings.gradle.kts" ]; then
            echo "::error::解压后仍然找不到 settings.gradle.kts"
            exit 1
          fi

          echo "Android 工程已准备完成"

      - name: Verify Android project
        run: |
          echo "========== Project files =========="
          ls -la
          echo "========== App files =========="
          ls -la app/src/main

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p "$GITHUB_WORKSPACE" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Mobile-Viewer-V0.2.0
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Mobile-Viewer-Build-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
